<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Robotaxi Coverage Dashboard</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }
        #filters {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        select {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #00ff00;
            padding: 5px 10px;
            border-radius: 5px;
        }
        #progress-container {
            max-width: 800px;
            width: 100%;
        }
        .city-progress {
            background-color: #1e1e1e;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
            position: relative;
        }
        .city-progress.hidden {
            display: none;
        }
        .city-progress h3 {
            margin: 0 0 10px 0;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mode-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .safety-driver { background-color: #ff0000; color: white; }
        .safety-passenger { background-color: #ff7f00; color: white; }
        .fully-autonomous { background-color: #00ff00; color: black; }
        .details-btn {
            background: none;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
        }
        .details-panel {
            display: none;
            background-color: #333;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
        }
        .details-panel table {
            width: 100%;
            border-collapse: collapse;
        }
        .details-panel th, .details-panel td {
            padding: 5px;
            text-align: left;
            border-bottom: 1px solid #555;
        }
        .progress-bar {
            position: relative;
            height: 25px;
            background-color: #333333;
            border: 2px solid #c0c0c0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 
                inset 0 2px 4px rgba(192, 192, 192, 0.3),
                inset 0 -2px 4px rgba(0, 0, 0, 0.5),
                0 0 10px rgba(192, 192, 192, 0.2);
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 700% 100%;
            border-radius: 10px;
            animation: colorShift 15s ease-in-out infinite;
            transition: width 0.5s ease;
        }
        @keyframes colorShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 700% 50%; }
        }
        .label {
            display: block;
            text-align: center;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        #show-more {
            color: #00ff00;
            text-decoration: none;
            font-size: 18px;
            margin-top: 20px;
            padding: 10px 20px;
            border: 1px solid #00ff00;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        #show-more:hover {
            background-color: #00ff00;
            color: #121212;
        }
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <h1>Tesla Robotaxi Coverage Dashboard</h1>
    <div id="filters">
        <select id="state-filter">
            <option value="">All States</option>
            <option value="TX">Texas</option>
            <option value="CA">California</option>
            <option value="AZ">Arizona</option>
            <option value="NV">Nevada</option>
            <option value="FL">Florida</option>
            <option value="IL">Illinois</option>
            <option value="CO">Colorado</option>
        </select>
        <select id="mode-filter">
            <option value="">All Modes</option>
            <option value="safety_driver">Safety Driver</option>
            <option value="safety_passenger">Safety Passenger</option>
            <option value="fully_autonomous">Fully Autonomous</option>
        </select>
    </div>
    <div id="progress-container"></div>
    <a href="#" id="show-more">Show more</a>

    <script>
        // Data based on October 2025 status: Public availability limited, with safety monitors in TX, drivers in CA, testing elsewhere.
        const citiesData = [
            { name: "Austin, TX", state: "TX", mode: "safety_passenger", percent: 25, details: { geofence: "173 sq mi", fleet: "100+", interventions: "1 per 1000 mi", fsd: "v13.2", hdmap: "95%" } },
            { name: "San Francisco, CA", state: "CA", mode: "safety_driver", percent: 8, details: { geofence: "60 sq mi", fleet: "100+", interventions: "1 per 800 mi", fsd: "v13.1", hdmap: "85%" } },
            { name: "San Jose, CA", state: "CA", mode: "safety_driver", percent: 7, details: { geofence: "50 sq mi", fleet: "50+", interventions: "1 per 900 mi", fsd: "v13.1", hdmap: "80%" } },
            { name: "Oakland, CA", state: "CA", mode: "safety_driver", percent: 6, details: { geofence: "40 sq mi", fleet: "50+", interventions: "1 per 850 mi", fsd: "v13.1", hdmap: "82%" } },
            { name: "Los Angeles, CA", state: "CA", mode: "safety_driver", percent: 2, details: { geofence: "20 sq mi", fleet: "20+", interventions: "1 per 700 mi", fsd: "v13.0", hdmap: "70%" } },
            { name: "San Diego, CA", state: "CA", mode: "safety_driver", percent: 1, details: { geofence: "15 sq mi", fleet: "10+", interventions: "1 per 600 mi", fsd: "v13.0", hdmap: "65%" } },
            { name: "Phoenix, AZ", state: "AZ", mode: "safety_passenger", percent: 3, details: { geofence: "30 sq mi", fleet: "30+", interventions: "1 per 950 mi", fsd: "v13.1", hdmap: "75%" } },
            { name: "Las Vegas, NV", state: "NV", mode: "safety_passenger", percent: 2, details: { geofence: "25 sq mi", fleet: "20+", interventions: "1 per 900 mi", fsd: "v13.1", hdmap: "72%" } },
            { name: "Dallas, TX", state: "TX", mode: "safety_passenger", percent: 1, details: { geofence: "10 sq mi", fleet: "10+", interventions: "1 per 500 mi", fsd: "v13.0", hdmap: "50%" } },
            { name: "Miami, FL", state: "FL", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v12.5", hdmap: "40%" } },
            { name: "Tampa, FL", state: "FL", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v12.5", hdmap: "35%" } },
            { name: "Chicago, IL", state: "IL", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v13.0", hdmap: "45%" } },
            { name: "Denver, CO", state: "CO", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v13.0", hdmap: "40%" } },
            { name: "New York City, NY", state: "NY", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v12.5", hdmap: "30%" } },
            { name: "Houston, TX", state: "TX", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v13.0", hdmap: "55%" } },
            { name: "San Antonio, TX", state: "TX", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v13.0", hdmap: "50%" } },
            { name: "Philadelphia, PA", state: "PA", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v12.5", hdmap: "25%" } },
            { name: "Jacksonville, FL", state: "FL", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v12.5", hdmap: "30%" } },
            { name: "Orlando, FL", state: "FL", mode: "testing", percent: 0, details: { geofence: "N/A", fleet: "Testing", interventions: "N/A", fsd: "v12.5", hdmap: "35%" } }
        ];

        let allCities = [...citiesData];
        let visibleCities = allCities.filter(c => c.percent > 0);
        let hiddenCities = allCities.filter(c => c.percent === 0);

        function renderCities(cities) {
            const container = document.getElementById('progress-container');
            container.innerHTML = '';
            cities.forEach(city => {
                const div = document.createElement('div');
                div.className = `city-progress ${city.percent === 0 ? 'hidden' : ''}`;
                div.innerHTML = `
                    <h3>
                        ${city.name}
                        <span class="mode-badge ${city.mode}">${city.mode.replace('_', ' ').toUpperCase()}</span>
                        <button class="details-btn" onclick="toggleDetails(this)">Details</button>
                    </h3>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${city.percent}%"></div>
                    </div>
                    <span class="label">${city.percent}% available (including metro area)</span>
                    <div class="details-panel">
                        <table>
                            <tr><th>Geofence</th><td>${city.details.geofence}</td></tr>
                            <tr><th>Fleet Size</th><td>${city.details.fleet}</td></tr>
                            <tr><th>Intervention Rate</th><td>${city.details.interventions}</td></tr>
                            <tr><th>FSD Version</th><td>${city.details.fsd}</td></tr>
                            <tr><th>HD Map Coverage</th><td>${city.details.hdmap}</td></tr>
                        </table>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleDetails(btn) {
            const panel = btn.nextElementSibling.nextElementSibling;
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function filterCities() {
            const stateFilter = document.getElementById('state-filter').value;
            const modeFilter = document.getElementById('mode-filter').value;
            let filtered = allCities.filter(city => {
                return (!stateFilter || city.state === stateFilter) &&
                       (!modeFilter || city.mode === modeFilter);
            });
            visibleCities = filtered.filter(c => c.percent > 0);
            hiddenCities = filtered.filter(c => c.percent === 0);
            renderCities(visibleCities);
            updateShowMore();
        }

        function updateShowMore() {
            const showMore = document.getElementById('show-more');
            const anyHidden = hiddenCities.length > 0 && document.querySelector('.city-progress.hidden');
            showMore.style.display = anyHidden ? 'block' : 'none';
        }

        document.getElementById('show-more').addEventListener('click', function(e) {
            e.preventDefault();
            const hiddenItems = document.querySelectorAll('.city-progress.hidden');
            hiddenItems.forEach(item => item.classList.toggle('hidden'));
            this.textContent = document.querySelector('.city-progress.hidden') ? 'Show more' : 'Show less';
        });

        document.getElementById('state-filter').addEventListener('change', filterCities);
        document.getElementById('mode-filter').addEventListener('change', filterCities);

        // WebGL Particle System for Neon Glow Flairs (2025 Best Practices: WebGL2, Shaders for Efficiency)
        function initWebGL() {
            const canvas = document.getElementById('webgl-canvas');
            const gl = canvas.getContext('webgl2');
            if (!gl) return;

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Vertex Shader
            const vsSource = `#version 300 es
                in vec2 a_position;
                uniform vec2 u_resolution;
                void main() {
                    vec2 zeroToOne = a_position / u_resolution;
                    vec2 zeroToTwo = zeroToOne * 2.0;
                    vec2 clipSpace = zeroToTwo - 1.0;
                    gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
                }`;

            // Fragment Shader with Neon Glow (Animated Particles)
            const fsSource = `#version 300 es
                precision highp float;
                out vec4 outColor;
                uniform vec2 u_resolution;
                uniform float u_time;
                void main() {
                    vec2 st = gl_FragCoord.xy / u_resolution.xy;
                    vec3 color = vec3(0.0);
                    for (float i = 0.0; i < 50.0; i++) {
                        float t = u_time + i * 0.1;
                        vec2 pos = vec2(sin(t + i) * 0.5 + 0.5, cos(t * 1.3 + i) * 0.5 + 0.5);
                        float dist = distance(st, pos);
                        float glow = exp(-dist * 10.0) * sin(t * 5.0 + i) * 0.5 + 0.5;
                        color += vec3(sin(t + i), cos(t * 0.7 + i), sin(t * 1.2 + i)) * glow / 50.0;
                    }
                    outColor = vec4(color, 0.5);
                }`;

            const vertexShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertexShader, vsSource);
            gl.compileShader(vertexShader);

            const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragmentShader, fsSource);
            gl.compileShader(fragmentShader);

            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            gl.useProgram(program);

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            const positions = new Float32Array([0, 0, canvas.width, 0, 0, canvas.height, canvas.width, canvas.height]);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

            const positionLocation = gl.getAttribLocation(program, 'a_position');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

            const resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
            const timeLocation = gl.getUniformLocation(program, 'u_time');

            function render(time) {
                gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
                gl.uniform1f(timeLocation, time * 0.001);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            render(0);

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            });
        }

        initWebGL();
        renderCities(visibleCities);
        updateShowMore();
    </script>
</body>
</html>
